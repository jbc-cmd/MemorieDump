<!DOCTYPE html>
<html>
<head>
  <title>Pre-compiler</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
</head>
<body>
  <h1>Compiling targets...</h1>
  <div id="status">Starting...</div>
  <script>
    async function run() {
      const status = document.getElementById('status');
      try {
        const compiler = new window.MINDAR.IMAGE.Compiler();
        
        const loadImg = (src) => new Promise((res, rej) => {
          const img = new Image();
          img.onload = () => res(img);
          img.onerror = rej;
          img.src = src;
        });

        status.innerText = 'Loading images...';
        const img1 = await loadImg('assets/targets/cyberpunk.jpg');
        const img2 = await loadImg('assets/targets/dolphin.jpg');

        status.innerText = 'Compiling feature descriptors...';
        await compiler.compileImageTargets([img1, img2], (progress) => {
          status.innerText = `Progress: ${Math.round(progress)}%`;
        });

        status.innerText = 'Exporting data...';
        const data = await compiler.exportData();
        
        // Send to local server to save
        status.innerText = 'Uploading targets.mind to server...';
        await fetch('/save-mind', {
          method: 'POST',
          body: data
        });

        status.innerText = 'SUCCESS: targets.mind generated and saved!';
      } catch (e) {
        status.innerText = 'Error: ' + e.message;
        console.error(e);
      }
    }
    window.onload = run;
  </script>
</body>
</html>
